<div class="barber-grid" role="group" aria-label="Escolha um barbeiro">
  @for (barber of barbers; track barber.id; let i = $index) {
    <button
      type="button"
      class="barber-card"
      [class.selected]="selected() === barber.id"
      [attr.aria-pressed]="selected() === barber.id"
      (click)="selectedChange.emit(barber.id)"
    >
      <span
        class="barber-monogram"
        [style.background]="barber.color"
        aria-hidden="true"
        >{{ barber.initials }}</span
      >
      <span class="barber-copy"
        ><span class="barber-name">{{ barber.name }}</span>
        <span class="barber-signature">{{ barber.signature }}</span></span
      >
      <span class="check" aria-hidden="true">{{
        selected() === barber.id ? "✓" : ""
      }}</span>
    </button>
  }
</div>
